# TLS-only AMQP. Vehicle MQTTS is served by the Go backend on port 8883.
listeners.tcp = none
listeners.ssl.default = 5671

ssl_options.cacertfile = /etc/rabbitmq/tls/ca.crt
ssl_options.certfile = /etc/rabbitmq/tls/rabbitmq-server.crt
ssl_options.keyfile = /etc/rabbitmq/tls/rabbitmq-server.key
ssl_options.verify = verify_peer
ssl_options.fail_if_no_peer_cert = false
ssl_options.versions.1 = tlsv1.3
ssl_options.versions.2 = tlsv1.2

auth_mechanisms.1 = PLAIN
loopback_users.guest = true

management.listener.port = 15671
management.listener.ssl = true
management.listener.ssl_opts.cacertfile = /etc/rabbitmq/tls/ca.crt
management.listener.ssl_opts.certfile = /etc/rabbitmq/tls/rabbitmq-server.crt
management.listener.ssl_opts.keyfile = /etc/rabbitmq/tls/rabbitmq-server.key
management.listener.ssl_opts.versions.1 = tlsv1.3
management.listener.ssl_opts.versions.2 = tlsv1.2
