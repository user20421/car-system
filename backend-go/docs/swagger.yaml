basePath: /
definitions:
  handler.AckRequest:
    properties:
      status:
        enum:
        - executed
        - failed
        type: string
    required:
    - status
    type: object
  handler.AlarmRuleRequest:
    properties:
      enabled:
        type: boolean
      metric:
        enum:
        - speed
        - rpm
        - battery
        - fault_code
        type: string
      name:
        maxLength: 64
        type: string
      operator:
        enum:
        - lt
        - lte
        - gt
        - gte
        - ne
        type: string
      severity:
        enum:
        - info
        - warning
        - critical
        type: string
      threshold:
        type: number
    required:
    - metric
    - name
    - operator
    - severity
    type: object
  handler.AuthRequest:
    properties:
      password:
        minLength: 6
        type: string
      username:
        maxLength: 64
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  handler.CommandRequest:
    properties:
      command:
        enum:
        - lock
        - unlock
        - ac_on
        - ac_off
        - honk
        type: string
    required:
    - command
    type: object
  handler.CreateUserRequest:
    properties:
      password:
        minLength: 6
        type: string
      role:
        enum:
        - admin
        - owner
        type: string
      username:
        maxLength: 64
        minLength: 3
        type: string
    required:
    - password
    - role
    - username
    type: object
  handler.FenceRequest:
    properties:
      alarm_on:
        enum:
        - enter
        - exit
        - both
        type: string
      enabled:
        type: boolean
      lat:
        maximum: 90
        minimum: -90
        type: number
      lng:
        maximum: 180
        minimum: -180
        type: number
      name:
        maxLength: 64
        type: string
      radius_m:
        type: number
      vin:
        description: 空 = 全部车辆
        type: string
    required:
    - alarm_on
    - name
    - radius_m
    type: object
  handler.TelemetryRequest:
    properties:
      battery:
        maximum: 100
        minimum: 0
        type: number
      fault_code:
        type: string
      lat:
        maximum: 90
        minimum: -90
        type: number
      lng:
        maximum: 180
        minimum: -180
        type: number
      rpm:
        minimum: 0
        type: integer
      speed:
        minimum: 0
        type: number
      vin:
        type: string
    required:
    - vin
    type: object
  handler.VehicleUpsertRequest:
    properties:
      model:
        maxLength: 64
        type: string
      owner_id:
        type: integer
      vin:
        type: string
    required:
    - model
    - owner_id
    - vin
    type: object
  simulator.Params:
    properties:
      fault_rate:
        description: 0 ~ 0.1，每帧触发故障的概率
        type: number
      interval_ms:
        description: 100 ~ 5000
        type: integer
      vehicle_count:
        description: 1 ~ 50
        type: integer
    type: object
host: localhost:8080
info:
  contact:
    name: user20421
  description: 车联网系统后端接口文档：鉴权 / 车辆遥测 / 实时推送
  title: Car System 车联网后端 API
  version: "1.0"
paths:
  /api/v1/alarm/records:
    get:
      parameters:
      - description: active | resolved，空为全部
        in: query
        name: status
        type: string
      - description: 条数(默认50, 最大200)
        in: query
        name: limit
        type: integer
      responses:
        "200":
          description: data 为告警数组
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 告警记录列表
      tags:
      - 告警
  /api/v1/alarm/records/{id}/resolve:
    post:
      parameters:
      - description: 告警 ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: 已恢复
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 人工恢复告警
      tags:
      - 告警
  /api/v1/alarm/rules:
    get:
      responses:
        "200":
          description: data 为规则数组
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 告警规则列表
      tags:
      - 告警
    post:
      parameters:
      - description: 规则
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.AlarmRuleRequest'
      responses:
        "200":
          description: 创建成功
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 新建告警规则
      tags:
      - 告警
  /api/v1/alarm/rules/{id}:
    delete:
      parameters:
      - description: 规则 ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: 删除成功
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 删除告警规则
      tags:
      - 告警
    put:
      parameters:
      - description: 规则 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 规则
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.AlarmRuleRequest'
      responses:
        "200":
          description: 更新成功
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 更新告警规则
      tags:
      - 告警
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: 登录信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.AuthRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功，data.token 为 JWT
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 参数不合法
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 用户名或密码错误
          schema:
            additionalProperties: true
            type: object
      summary: 用户登录
      tags:
      - 鉴权
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: 注册信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.AuthRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 注册成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 参数不合法
          schema:
            additionalProperties: true
            type: object
        "409":
          description: 用户名已存在
          schema:
            additionalProperties: true
            type: object
      summary: 用户注册
      tags:
      - 鉴权
  /api/v1/fences:
    get:
      responses:
        "200":
          description: data 为围栏数组
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 电子围栏列表
      tags:
      - 告警
    post:
      parameters:
      - description: 围栏
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.FenceRequest'
      responses:
        "200":
          description: 创建成功
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 新建电子围栏
      tags:
      - 告警
  /api/v1/fences/{id}:
    delete:
      parameters:
      - description: 围栏 ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: 删除成功
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 删除电子围栏
      tags:
      - 告警
  /api/v1/my/vehicles:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: data 为车辆数组
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 我的车辆列表
      tags:
      - 车辆
  /api/v1/profile:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: data 为 JWT Claims
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 未认证
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 当前用户信息
      tags:
      - 鉴权
  /api/v1/simulator/start:
    post:
      consumes:
      - application/json
      parameters:
      - description: 模拟参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/simulator.Params'
      produces:
      - application/json
      responses:
        "200":
          description: 已启动
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 启动虚拟车队
      tags:
      - 模拟器
  /api/v1/simulator/status:
    get:
      responses:
        "200":
          description: running + params
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 虚拟车队状态
      tags:
      - 模拟器
  /api/v1/simulator/stop:
    post:
      responses:
        "200":
          description: 已停止
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 停止虚拟车队
      tags:
      - 模拟器
  /api/v1/system/dead-letters:
    get:
      responses:
        "200":
          description: data 为死信记录数组
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 查询死信消息列表
      tags:
      - 系统
  /api/v1/system/dead-letters/{id}/requeue:
    post:
      parameters:
      - description: 死信记录 ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: 重投成功
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 记录不存在
          schema:
            additionalProperties: true
            type: object
        "500":
          description: MQ 不可用
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 重投指定死信消息
      tags:
      - 系统
  /api/v1/system/metrics:
    get:
      responses:
        "200":
          description: goroutines/内存/连接池/消息计数/队列深度
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 后端实时性能指标
      tags:
      - 系统
  /api/v1/system/outbox:
    get:
      parameters:
      - description: pending | sent | failed，空为全部
        in: query
        name: status
        type: string
      responses:
        "200":
          description: data 为 Outbox 记录数组
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Outbox 发件箱列表
      tags:
      - 系统
  /api/v1/users:
    get:
      responses:
        "200":
          description: data 为用户数组（不含密码）
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 用户列表
      tags:
      - 用户
    post:
      parameters:
      - description: 用户信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.CreateUserRequest'
      responses:
        "200":
          description: 创建成功
          schema:
            additionalProperties: true
            type: object
        "409":
          description: 用户名已存在
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 创建用户
      tags:
      - 用户
  /api/v1/vehicle:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: data 为车辆数组
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 权限不足
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 车辆列表
      tags:
      - 车辆
    post:
      parameters:
      - description: 车辆信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.VehicleUpsertRequest'
      responses:
        "200":
          description: 登记成功
          schema:
            additionalProperties: true
            type: object
        "409":
          description: VIN 已存在
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 登记车辆
      tags:
      - 车辆
  /api/v1/vehicle/{vin}:
    delete:
      parameters:
      - description: 车架号
        in: path
        name: vin
        required: true
        type: string
      responses:
        "200":
          description: 删除成功
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 删除车辆
      tags:
      - 车辆
    get:
      parameters:
      - description: 车架号
        in: path
        name: vin
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: data 为车辆信息
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 车辆详情
      tags:
      - 车辆
    put:
      parameters:
      - description: 车架号
        in: path
        name: vin
        required: true
        type: string
      - description: 车辆信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.VehicleUpsertRequest'
      responses:
        "200":
          description: 更新成功
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 更新车辆
      tags:
      - 车辆
  /api/v1/vehicle/{vin}/command:
    post:
      consumes:
      - application/json
      parameters:
      - description: 车架号
        in: path
        name: vin
        required: true
        type: string
      - description: '指令: lock/unlock/ac_on/ac_off/honk'
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.CommandRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 指令已下发
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 远程控车
      tags:
      - 控车
  /api/v1/vehicle/{vin}/command/{id}/ack:
    post:
      consumes:
      - application/json
      parameters:
      - description: 车架号
        in: path
        name: vin
        required: true
        type: string
      - description: 指令ID
        in: path
        name: id
        required: true
        type: integer
      - description: '回执: executed/failed'
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.AckRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 回执已记录
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 指令执行回执
      tags:
      - 控车
  /api/v1/vehicle/{vin}/commands:
    get:
      parameters:
      - description: 车架号
        in: path
        name: vin
        required: true
        type: string
      - description: 条数(默认20)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 指令列表
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 指令历史
      tags:
      - 控车
  /api/v1/vehicle/{vin}/telemetry/history:
    get:
      parameters:
      - description: 车架号
        in: path
        name: vin
        required: true
        type: string
      - description: 条数(默认60, 最大300)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: data 按时间正序
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 车况历史
      tags:
      - 车辆
  /api/v1/vehicle/{vin}/telemetry/latest:
    get:
      parameters:
      - description: 车架号 (17位)
        in: path
        name: vin
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: data 为最新车况
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 车辆或数据不存在
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 查询最新车况
      tags:
      - 车辆
  /api/v1/vehicle/telemetry:
    post:
      consumes:
      - application/json
      parameters:
      - description: 车况数据
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.TelemetryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 上报成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 参数不合法
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 车辆不存在
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 车机上报车况
      tags:
      - 车辆
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: 全部组件正常
          schema:
            additionalProperties: true
            type: object
        "503":
          description: 有组件异常
          schema:
            additionalProperties: true
            type: object
      summary: 健康检查
      tags:
      - 系统
securityDefinitions:
  BearerAuth:
    description: '格式: Bearer <token>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
