services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-car_system}
      MYSQL_USER: ${MYSQL_USER:-car_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      TZ: Asia/Shanghai
    command:
      - mysqld
      - --require-secure-transport=ON
      - --ssl-ca=/etc/mysql/tls/ca.crt
      - --ssl-cert=/etc/mysql/tls/mysql-server.crt
      - --ssl-key=/etc/mysql/tls/mysql-server.key
      - --tls-version=TLSv1.2,TLSv1.3
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - car_refactor_mysql_data:/var/lib/mysql
      - ./deploy/certs/ca.crt:/etc/mysql/tls/ca.crt:ro
      - ./deploy/certs/mysql-server.crt:/etc/mysql/tls/mysql-server.crt:ro
      - ./deploy/certs/mysql-server.key:/etc/mysql/tls/mysql-server.key:ro
    networks: [car_net]
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=socket --ssl-mode=DISABLED -uroot -p\"$$MYSQL_ROOT_PASSWORD\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    logging: &default_logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.0
    restart: unless-stopped
    environment:
      REDIS_USER: ${REDIS_USER:-car_app}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      TZ: Asia/Shanghai
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        printf 'user default off\nuser %s on >%s ~car:* &car:* +@all\n' "$${REDIS_USER}" "$${REDIS_PASSWORD}" > /tmp/users.acl
        exec redis-server /usr/local/etc/redis/redis.conf --aclfile /tmp/users.acl
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - car_refactor_redis_data:/data
      - ./deploy/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./deploy/certs/ca.crt:/etc/redis/tls/ca.crt:ro
      - ./deploy/certs/redis-server.crt:/etc/redis/tls/redis-server.crt:ro
      - ./deploy/certs/redis-server.key:/etc/redis/tls/redis-server.key:ro
    networks: [car_net]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --tls --cacert /etc/redis/tls/ca.crt --user \"$$REDIS_USER\" --pass \"$$REDIS_PASSWORD\" --no-auth-warning PING | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging: *default_logging

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-car_app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      RABBITMQ_DEFAULT_VHOST: car
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?RABBITMQ_ERLANG_COOKIE is required}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${AMQPS_HOST_PORT:-5671}:5671"
      - "127.0.0.1:${RABBITMQ_HTTPS_HOST_PORT:-15671}:15671"
    volumes:
      - car_refactor_rabbitmq_data:/var/lib/rabbitmq
      - ./deploy/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./deploy/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./deploy/certs/ca.crt:/etc/rabbitmq/tls/ca.crt:ro
      - ./deploy/certs/rabbitmq-server.crt:/etc/rabbitmq/tls/rabbitmq-server.crt:ro
      - ./deploy/certs/rabbitmq-server.key:/etc/rabbitmq/tls/rabbitmq-server.key:ro
    networks: [car_net]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s
    logging: *default_logging

networks:
  car_net:
    name: car_refactor_net
    driver: bridge

volumes:
  car_refactor_mysql_data:
    name: car_refactor_mysql_data
  car_refactor_redis_data:
    name: car_refactor_redis_data
  car_refactor_rabbitmq_data:
    name: car_refactor_rabbitmq_data
